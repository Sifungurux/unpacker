name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1

      # Catches a dependency going bad between reviews, on the PR that
      # would ship it rather than in a monthly audit. oras-go's auth
      # client is on the reachable path (see CLAUDE.md), so a credential
      # CVE there is not free for us.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
